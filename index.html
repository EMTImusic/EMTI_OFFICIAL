<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EMTI — Music Artist</title>
  <meta name="description" content="EMTI — Music Artist. Listen to EMTI's latest music and follow the official pages.">
  <meta name="theme-color" content="#050505">
  <meta property="og:title" content="EMTI — Music Artist">
  <meta property="og:description" content="Official EMTI music and social links.">
  <meta property="og:type" content="website">

  <!-- Helps search engines connect EMTI with the official profiles. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ProfilePage",
    "mainEntity": {
      "@type": "Person",
      "name": "EMTI",
      "alternateName": "EMTI Music",
      "description": "Music artist",
      "sameAs": [
        "https://youtube.com/@emti_mt3",
        "https://on.soundcloud.com/GTBcyc0SLBD1pZJFrB",
        "https://www.tiktok.com/@mt_emti",
        "https://t.me/EMTI_MT3",
        "https://www.instagram.com/emti_mt3/"
      ]
    }
  }
  </script>

  <style>
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0; min-height:100vh; color:#f4f4f4; background:#030303;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      overflow-x:hidden;
    }
    body:before{
      content:""; position:fixed; inset:-20%; z-index:-2;
      background:
        radial-gradient(circle at 50% 10%,rgba(120,0,0,.18),transparent 28%),
        radial-gradient(circle at 85% 75%,rgba(255,255,255,.035),transparent 25%);
      filter:blur(25px);
    }
    body:after{
      content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
      background:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px);
      background-size:100% 4px; opacity:.12;
    }
    .wrap{width:min(920px,92%);margin:auto}
    header{padding:42px 0 18px;text-align:center}
    .mark{
      width:108px;height:108px;border:1px solid #262626;border-radius:50%;
      display:grid;place-items:center;margin:0 auto 25px;
      background:linear-gradient(145deg,#111,#050505);
      box-shadow:0 0 55px rgba(255,0,0,.09), inset 0 0 35px rgba(255,255,255,.025);
      font-weight:900;font-size:28px;letter-spacing:-2px;
    }
    .eyebrow{font-size:11px;letter-spacing:5px;color:#777;text-transform:uppercase}
    h1{font-size:clamp(52px,12vw,104px);line-height:.85;letter-spacing:-7px;margin:13px 0 15px}
    .sub{color:#8b8b8b;font-size:14px;letter-spacing:2px}
    .line{height:1px;background:#1c1c1c;margin:42px 0}
    .section-title{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:#666;margin-bottom:15px}
    .release{
      display:flex;align-items:center;justify-content:space-between;gap:20px;
      padding:22px 20px;border:1px solid #202020;border-radius:18px;
      background:rgba(255,255,255,.025);transition:.25s;
    }
    .release:hover{border-color:#3a3a3a;transform:translateY(-2px)}
    .release h2{margin:0 0 5px;font-size:22px}
    .release p{margin:0;color:#777;font-size:13px}
    .play{
      display:inline-flex;align-items:center;justify-content:center;
      min-width:92px;padding:12px 17px;border:1px solid #444;border-radius:999px;
      color:#fff;text-decoration:none;font-size:12px;letter-spacing:1px;
      transition:.2s
    }
    .play:hover{background:#fff;color:#000}
    .links{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    .link{
      padding:18px 19px;border:1px solid #1c1c1c;border-radius:15px;
      color:#eee;text-decoration:none;background:#080808;transition:.2s;
      display:flex;justify-content:space-between;align-items:center;
    }
    .link span{color:#666;font-size:12px}
    .link:hover{border-color:#444;background:#0d0d0d;transform:translateY(-2px)}
    footer{padding:55px 0 35px;text-align:center;color:#444;font-size:11px;letter-spacing:2px}
    @media(max-width:600px){.links{grid-template-columns:1fr}.release{align-items:flex-start}.play{min-width:80px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="mark">EM</div>
      <div class="eyebrow">Music Artist</div>
      <h1>EMTI</h1>
      <div class="sub">JUST NEED MUSIC.</div>
    </header>

    <div class="line"></div>

    <section>
      <div class="section-title">Latest release</div>
      <div class="release">
        <div>
          <h2>MOHEM NI</h2>
          <p>EMTI · Official release</p>
        </div>
        <a class="play" href="https://on.soundcloud.com/GTBcyc0SLBD1pZJFrB" target="_blank" rel="noopener">LISTEN ↗</a>
      </div>
    </section>

    <div class="line"></div>

    <section>
      <div class="section-title">Official</div>
      <div class="links">
        <a class="link" href="https://youtube.com/@emti_mt3" target="_blank" rel="noopener"><b>YouTube</b><span>@emti_mt3 ↗</span></a>
        <a class="link" href="https://on.soundcloud.com/GTBcyc0SLBD1pZJFrB" target="_blank" rel="noopener"><b>SoundCloud</b><span>EMTI ↗</span></a>
        <a class="link" href="https://www.tiktok.com/@mt_emti" target="_blank" rel="noopener"><b>TikTok</b><span>@mt_emti ↗</span></a>
        <a class="link" href="https://www.instagram.com/emti_mt3/" target="_blank" rel="noopener"><b>Instagram</b><span>@emti_mt3 ↗</span></a>
        <a class="link" href="https://t.me/EMTI_MT3" target="_blank" rel="noopener"><b>Telegram</b><span>@EMTI_MT3 ↗</span></a>
      </div>
    </section>

    <footer>© EMTI · OFFICIAL</footer>
  </main>
</body>
</html>
